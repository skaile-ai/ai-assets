spec_version: "0.2"
name: "forge-project-assistant"
version: "1.1.0"
description: "Focused software development assistant — reads, writes, and explains code in developer project workspaces"
model:
  # Family alias: auto-rolls to the current top Opus model. A full ID like
  # claude-opus-5 fails ModelIdSchema today (see workspaces#03).
  preferred: "opus"
  fallback:
    - "claude-haiku-4-5-20251001"
  constraints:
    temperature: 0.2
    max_tokens: 8096
tools:
  # Canonical Claude Code tool names; the omp driver maps them onto its own
  # built-ins and passes `--tools read,write,edit,bash,glob,grep,web_search,todo,ask`.
  # Names with no omp built-in (WebFetch, BashOutput, KillShell) are dropped for
  # that backend and only take effect on claude-sdk.
  #
  # Justified by SOUL.md ("Reading and explaining code", "Writing new code",
  # "Editing and refactoring", "Debugging", "File management", "research") and by
  # the three declared skills: code-assistance (read/edit), file-management
  # (read/write/list/delete) and project-exploration (directory listing, config
  # files, `git log` — hence Bash).
  #
  # Omitted on purpose — nothing in SOUL.md, RULES.md or the skills invokes them:
  #   browser  (browser automation)   computer (desktop capture/input)
  #   notebook (Jupyter)              lsp      (language server)
  #   python   (persistent kernel — Bash covers ad-hoc scripts)
  #   task     (sub-agent spawning; this manifest declares no `delegation:` block,
  #             and its description doc is the single largest tool schema omp ships)
  allowed:
    - Read
    - Write
    - Edit
    - Bash
    - BashOutput
    - KillShell
    - Glob
    - Grep
    - WebSearch
    - WebFetch
    - TodoWrite
    - AskUserQuestion
composes:
  - { kind: skill, ref: ./skills/code-assistance }
  - { kind: skill, ref: ./skills/file-management }
  - { kind: skill, ref: ./skills/project-exploration }
# The former `session_error` hook (hooks/hooks.yaml: log-session-error) now runs as a trigger (`report-session-error`: it reports instead of logging).
# The 0.2 trigger schema has no async/background flag and the host decides how a fired trigger is
# scheduled, so the old `async: true` has no equivalent here. The prompt is plain text: the framework
# defines no payload interpolation for `event` triggers, and the old `scripts/log-error.sh` never existed.
triggers:
  - kind: event
    id: report-session-error
    event: session_error
    prompt: "A session error was reported for this project. Tell the user in one or two sentences what failed, quoting the error message if this notification includes one. Do not retry the failed step unless the user asks; otherwise carry on."
runtime:
  max_turns: 100
  timeout: 1800
author: "ecsplico"
license: "MIT"
tags:
  - "developer-tools"
  - "coding-assistant"
  - "project-workspace"
metadata:
  repo: "bitbucket.org/ecsplico/skaile-dev"
  canonical_path: "ai-assets/skaile-forge/agent"
  app: "skaile-forge"
  imprint_on_project_open: true
  stage: "alpha"
