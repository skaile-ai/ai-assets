spec_version: "0.2"
name: "forge-project-orchestrator"
version: "1.2.0"
description: "Project workspace assistant — helps with coding, writing, research, and file management"
model:
  # Family alias: auto-rolls to the current top Opus model. A full ID like
  # claude-opus-5 fails ModelIdSchema today (see workspaces#03).
  preferred: "opus"
  fallback:
    - "claude-haiku-4-5-20251001"
  constraints:
    temperature: 0.2
    max_tokens: 8192
tools:
  # Canonical Claude Code tool names; the omp driver maps them onto its own
  # built-ins and passes `--tools read,write,edit,bash,glob,grep,web_search,todo,ask`.
  # Names with no omp built-in (WebFetch, BashOutput, KillShell) are dropped for
  # that backend and only take effect on claude-sdk.
  #
  # Justified by SOUL.md ("Reading and explaining code", "Writing new code",
  # "Editing and refactoring", "Debugging", "File management", "research") and by
  # the three declared skills: code-assistance (read/edit), file-management
  # (read/write/list/delete) and project-exploration (directory listing, config
  # files, `git log` — hence Bash).
  #
  # Omitted on purpose — nothing in SOUL.md, RULES.md or the skills invokes them:
  #   browser  (browser automation)   computer (desktop capture/input)
  #   notebook (Jupyter)              lsp      (language server)
  #   python   (persistent kernel — Bash covers ad-hoc scripts)
  #   task     (sub-agent spawning; this manifest declares no `delegation:` block,
  #             and its description doc is the single largest tool schema omp ships)
  allowed:
    - Read
    - Write
    - Edit
    - Bash
    - BashOutput
    - KillShell
    - Glob
    - Grep
    - WebSearch
    - WebFetch
    - TodoWrite
    - AskUserQuestion
composes:
  - { kind: skill, ref: skill:@skaile-ai/code-assistance }
  - { kind: skill, ref: skill:@skaile-ai/file-management }
  - { kind: skill, ref: skill:@skaile-ai/project-exploration }
# Memory blocks the host (skaile-forge) stores and the runner renders as <MEMORY>; they replace the
# old assistant overlay files and the /api/internal/memory namespaces /user /soul /learned /self.
# All four are `scope: user`, so they are shared across the user's instances.
# `description` is not read by the runner; it documents the block for authors and the memory editor.
memory:
  blocks:
    - { name: user, scope: user, max_chars: 3000, description: "Facts about the user: name, preferences, interests, timezone, work context." }
    - { name: soul, scope: user, max_chars: 4000, description: "The assistant's persona notes: identity, personality and tone directives." }
    - { name: learned, scope: user, max_chars: 6000, description: "Lessons learned: behaviours and patterns that worked or failed." }
    - { name: self, scope: user, max_chars: 3000, description: "Self-notes: the assistant's observations about itself and how it works." }
runtime:
  max_turns: 100
  timeout: 1800
author: "ecsplico"
license: "MIT"
tags:
  - "coding-assistant"
  - "project-workspace"
metadata:
  repo: "bitbucket.org/ecsplico/skaile-dev"
  canonical_path: "ai-assets/skaile-forge/project-orchestrator"
  app: "skaile-forge"
  stage: "alpha"
