# Asset Source configuration for ai-assets (v1 file)
#
# skaile.manifest.yaml is the canonical publish manifest: it names the one
# publisher (skaile-ai) every asset in this repo ships under, and the store's
# sync reads it in preference to this file. This v1 file exists only for v1
# readers (for example the store's curation preview) and must agree with it:
# the default publisher is '@' + the manifest's publisher, and there are no
# per-folder publisher overrides. scripts/source-publishers.test.sh enforces it.

version: 1
publisher_default: '@skaile-ai'
default_ref: main
sync:
  trigger: webhook
