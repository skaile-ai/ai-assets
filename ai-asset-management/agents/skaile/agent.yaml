spec_version: '0.2'
name: 'skaile'
version: '1.1.0'
description: 'Skaile unified AI agent — orchestrates conceptualization, implementation, and quality workflows (architecture questions it answers itself) across the full software development lifecycle.'

# ── Composition (mixin pattern) ──────────────────────────────────────────────
# Paths are relative to this agent.yaml's directory.
# ../../../  → ai-assets/
# Delegate agents are catalog refs: they ship from ai-assets-skaileup.
composes:
  - { kind: persona, ref: ../../../_agent-parts/personas/skaile-base/PERSONA.md }
  - { kind: ruleset, ref: ../../../_agent-parts/rules/skaile-safety/RULESET.md }
  - { kind: agent, ref: "agent:@skaile-ai/skaileup-conceptualize", as: conceptualization, binding: delegate }
  - { kind: agent, ref: "agent:@skaile-ai/impl-build-implement", as: implementation, binding: delegate }
  - { kind: agent, ref: "agent:@skaile-ai/quality", as: quality, binding: delegate }

model:
  preferred: 'claude-sonnet-4-6'
  fallback:
    - 'claude-opus-4-6'
    - 'claude-haiku-4-5-20251001'
  constraints:
    temperature: 0.2
    max_tokens: 8192
delegation:
  mode: 'router'
  router: 'orchestrator'
agents:
  conceptualization:
    description: 'Structured project concept pipeline — discovery, experience design, and technical blueprint'
    delegation:
      mode: 'auto'
      triggers:
        - 'concept_requested'
        - 'discovery_requested'
        - 'blueprint_requested'
        - 'feature_spec_requested'
  implementation:
    description: 'Implementation pipeline — scaffolding, TDD feature development, verification, migrations, seed data'
    delegation:
      mode: 'auto'
      triggers:
        - 'implementation_requested'
        - 'scaffold_requested'
        - 'feature_implementation_requested'
        - 'migration_requested'
  quality:
    description: 'Quality assurance — code audits, test generation, readiness gates, cross-reference repair'
    delegation:
      mode: 'auto'
      triggers:
        - 'quality_check_requested'
        - 'audit_requested'
        - 'test_generation_requested'
        - 'readiness_check_requested'
author: 'skaile'
license: 'MIT'
tags:
  - 'ai-agent'
  - 'skills'
  - 'conceptualization'
  - 'implementation'
  - 'quality'
metadata:
  monorepo: 'skaile-skills'
  framework: 'gitagent'
  spec_source: 'gitagent.sh'
  stage: 'alpha'
  dropped_delegates:
    - 'architecture — no agent asset is published yet; the former requires entry pointed at a path that no longer exists. Its `agents:` block and routing triggers are gone too; Skaile answers architecture questions itself.'
