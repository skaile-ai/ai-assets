name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        # Auth via the teamclaude pool (multi-account proxy) instead of one
        # subscription's OAuth token, so a run does not share the 5h session limit.
        env:
          ANTHROPIC_BASE_URL: https://teamclaude.postxl.com
          ANTHROPIC_CUSTOM_HEADERS: |
            X-Teamclaude-Project: ${{ github.repository }}
            X-Teamclaude-Ref: ${{ github.event.pull_request.number && format('pull/{0}', github.event.pull_request.number) || github.event.issue.pull_request && format('pull/{0}', github.event.issue.number) || github.event.issue.number && format('issue/{0}', github.event.issue.number) || github.ref_name }}
        with:
          anthropic_api_key: ${{ secrets.TEAMCLAUDE_CI_KEY }}
          additional_permissions: |
            actions: read
