name: Test

# The lane exists so that logic extracted out of a SKILL.md into a script can be
# verified. It runs on every pull request, and on pushes to main so a bad merge
# is attributed to the merge rather than to the next PR that happens to run.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # `npm test` rather than `bash tests/run.sh` on purpose: the package.json
      # script is the documented entry point, so CI must be what proves it still
      # works. Invoking the runner directly would let that script rot unnoticed.
      - name: Run tests
        run: npm test
