spec_version: '0.2'
name: 'skaile-development'
version: '1.2.0'
description: 'Expert advisor for the skaile-dev monorepo. Routes implementation tasks to the right skills and prog-experts, orchestrates multi-step workflows (implement → test → docs → devlog), and provides context-aware guidance grounded in the actual package CLAUDE.md files.'
# Self-contained: no `extends`. The runner's composition resolver does not follow `extends`, only
# `skaile install` does, so an inherited agent was built differently by the two. Everything this agent
# uses is declared here: its skills. Nothing is taken from the `skaile` agent: its `skaile-base` persona
# is the router agent's identity ("route to domain agents") and would contradict this agent's own SOUL.md;
# its `skaile-safety` ruleset is mostly concept-pipeline rules (`_concept/` artifacts, a boundary against any
# work outside `_concept/` or the project directory), which contradict this agent's job of git, tests, docs
# and devlogs across the monorepo, so this agent's own RULES.md carries only the generic clauses that apply
# (diff before commit, no overwriting user files, the golden_principles / iron_laws pointers its `implement`
# skill relies on, the two Safety & Ethics clauses); and its three pipeline delegates (conceptualize /
# implement / quality): this agent's SOUL.md routes to skills only. On `main` this agent inherited none of
# it (its `extends` path was broken), so composing none of it keeps `main`'s behaviour.
model:
  # Family alias: auto-rolls to the current top Opus model. A full ID like
  # claude-opus-5 fails ModelIdSchema today (see workspaces#03).
  preferred: 'opus'
  fallback:
    - 'sonnet'
  constraints:
    temperature: 0.15
    max_tokens: 8192
delegation:
  mode: 'explicit'
runtime:
  max_turns: 150
  timeout: 2400
author: 'skaile'
license: 'MIT'
tags:
  - 'advisor'
  - 'monorepo'
  - 'skaile-development'
  - 'routing'
  - 'orchestrator'
  - 'workspace'
composes:
  - { kind: skill, ref: skill:@skaile-ai/git }
  - { kind: skill, ref: skill:@skaile-ai/implement }
  - { kind: skill, ref: skill:@skaile-ai/test }
  - { kind: skill, ref: skill:@skaile-ai/doc }
  - { kind: skill, ref: skill:@skaile-ai/devlog }
  - { kind: skill, ref: skill:@skaile-ai/notify }
  - { kind: skill, ref: skill:@skaile-ai/faq }
  - { kind: skill, ref: skill:@skaile-ai/release }
metadata:
  domain: 'skaile-development'
  stage: 'beta'
  routing_notes:
    - dev-implementation-experts-js (prog-expert-nuxt, prog-expert-omp, prog-expert-tiptap, ...)
    - dev-implementation-experts-python (prog-expert-python, prog-expert-pydanticai)
    - skaileup-implementation-superpowers (implement-supervised, write-plan, brainstorm)
  knowledge_notes:
    - skaile-dev monorepo structure (CLAUDE.md, package layout, Bun workspace)
    - Platform packages (NestJS + React, Prisma, tRPC, Playwright)
    - Forge apps (Nuxt 4, drizzle-orm, SQLite)
    - Agent runtime stack (bridge, runner, flow-engine, resolver)
    - AI resources domain layout and skill conventions
