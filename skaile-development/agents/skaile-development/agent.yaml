spec_version: '0.2'
name: 'skaile-development'
version: '1.2.0'
description: 'Expert advisor for the skaile-dev monorepo. Routes implementation tasks to the right skills and prog-experts, orchestrates multi-step workflows (implement → test → docs → devlog), and provides context-aware guidance grounded in the actual package CLAUDE.md files.'
# Parent agent. `skaile install` merges it in (asset-manager install-agent.ts, applyExtendsMerge):
# `composes` is parent + child (deduped by kind/ref/id), other arrays are unioned, and every
# object key (`model`, `delegation`, `agents`, `metadata`) is replaced by the child's value.
# The parent's three delegate agents therefore ship with this agent (they are in the
# skaile-development preset); its persona and ruleset items are inherited but not rendered.
extends: '../../../ai-asset-management/agents/skaile/agent.yaml'
model:
  # Family alias: auto-rolls to the current top Opus model. A full ID like
  # claude-opus-5 fails ModelIdSchema today (see workspaces#03).
  preferred: 'opus'
  fallback:
    - 'sonnet'
  constraints:
    temperature: 0.15
    max_tokens: 8192
delegation:
  mode: 'explicit'
# The parent declares four auto-delegating `agents:` entries; objects are replaced, not merged, so
# an empty map here keeps this explicit-mode agent from inheriting them.
agents: {}
runtime:
  max_turns: 150
  timeout: 2400
author: 'skaile'
license: 'MIT'
tags:
  - 'advisor'
  - 'monorepo'
  - 'skaile-development'
  - 'routing'
  - 'orchestrator'
  - 'workspace'
composes:
  - { kind: skill, ref: skill:@skaile-ai/git }
  - { kind: skill, ref: skill:@skaile-ai/implement }
  - { kind: skill, ref: skill:@skaile-ai/test }
  - { kind: skill, ref: skill:@skaile-ai/doc }
  - { kind: skill, ref: skill:@skaile-ai/devlog }
  - { kind: skill, ref: skill:@skaile-ai/notify }
  - { kind: skill, ref: skill:@skaile-ai/faq }
  - { kind: skill, ref: skill:@skaile-ai/release }
metadata:
  domain: 'skaile-development'
  stage: 'beta'
  routing_notes:
    - dev-implementation-experts-js (prog-expert-nuxt, prog-expert-omp, prog-expert-tiptap, ...)
    - dev-implementation-experts-python (prog-expert-python, prog-expert-pydanticai)
    - skaileup-implementation-superpowers (implement-supervised, write-plan, brainstorm)
  knowledge_notes:
    - skaile-dev monorepo structure (CLAUDE.md, package layout, Bun workspace)
    - Platform packages (NestJS + React, Prisma, tRPC, Playwright)
    - Forge apps (Nuxt 4, drizzle-orm, SQLite)
    - Agent runtime stack (bridge, runner, flow-engine, resolver)
    - AI resources domain layout and skill conventions
