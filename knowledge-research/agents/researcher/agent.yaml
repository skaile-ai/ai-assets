spec_version: '0.2'
name: 'researcher'
version: '1.0.0'
description: 'Short-lived, read-only research role: takes a topic, searches the web and the workspace, and returns a sourced summary. Callable via agent.run with typed input and output.'
lifecycle: role
io:
  input:
    type: object
    required: [topic]
    additionalProperties: false
    properties:
      topic:
        type: string
        minLength: 1
        description: The question or subject to research.
  output:
    type: object
    required: [summary, sources]
    additionalProperties: false
    properties:
      summary:
        type: string
        description: Findings in plain prose, every claim traceable to a source.
      sources:
        type: array
        description: URLs or workspace paths the summary relies on; an empty list when nothing reliable was found.
        items:
          type: string
model:
  preferred: 'claude-sonnet-4-6'
  fallback:
    - 'claude-haiku-4-5-20251001'
  constraints:
    temperature: 0.2
    max_tokens: 8192
tools:
  allowed:
    - Read
    - Glob
    - Grep
    - Bash
    - WebSearch
    - WebFetch
runtime:
  max_turns: 40
  timeout: 900
author: 'skaile'
license: 'MIT'
tags:
  - 'research'
  - 'role'
  - 'knowledge-research'
composes:
  - { kind: skill, ref: skill:@skaile-ai/deep-research }
  - { kind: skill, ref: skill:@skaile-ai/use-exa }
  - { kind: skill, ref: skill:@skaile-ai/use-perplexity }
  - { kind: skill, ref: skill:@skaile-ai/use-searxng }
metadata:
  domain: 'knowledge-research'
  stage: 'alpha'
