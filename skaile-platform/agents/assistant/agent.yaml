spec_version: "0.2"
name: "skaile-assistant"
version: "1.2.0"
description: "Skaile platform assistant - enterprise AI workspace collaborator for research, analysis, writing, data work, and code"
model:
  preferred: "claude-sonnet-4-6"
  fallback:
    - "claude-haiku-4-5-20251001"
  constraints:
    temperature: 0.3
    max_tokens: 8192
memory:
  blocks:
    - { name: preferences, scope: user, max_chars: 4000, description: "How the user likes work done: formats, tools, conventions and corrections that apply next time." }
    - { name: commitments, scope: user, max_chars: 4000, description: "Open follow-ups: what the assistant promised or the user asked it to keep track of, with dates." }
    - { name: learned, scope: user, max_chars: 6000, description: "Lessons learned: approaches that worked or failed when helping this user." }
runtime:
  max_turns: 200
  timeout: 600
author: "skaile-ai"
license: "MIT"
tags:
  - "enterprise"
  - "workspace"
  - "multi-user"
metadata:
  canonical_path: "ai-assets/skaile-platform/agents/assistant"
  app: "skaile-platform"
  stage: "alpha"
