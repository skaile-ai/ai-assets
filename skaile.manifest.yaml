# skaile.manifest.yaml — publication manifest for skaile-ai/ai-assets
#
# What this repo PUBLISHES. Split out of `skaile.yaml` per
# workspaces/.../_devlog/specs/2026-06-03-manifest-file-split.md: `publisher:` /
# `version:` / `assets:` are rejected at parse time in `skaile.yaml` and live
# only here. `ai-assets` is a pure asset repo, so this is its only manifest.
#
# This file declares THE canonical publisher for every asset shipped from this
# repo. Consumer projects that resolve `<kind>:@skaile-ai/<name>` end up here.
#
# Version is omitted: the resolver derives it from `git describe --tags`. Cut
# a new git tag to publish a new version of every asset in this repo.

publisher: skaile-ai

# `assets:` MUST be exhaustive. `walker.ts:walkOne` falls back to the
# agentskills.io filename convention ONLY when no manifest declares any asset —
# a partial list silently un-publishes everything it omits. Every entry below was
# generated from that same convention walk, so this list is byte-identical to
# what the fallback discovered (123 assets).
#
# `root:` walks a directory recursively. `files:` globs are resolved against the
# REPO ROOT, not against `root:` — never combine the two for a single-file asset
# (that walks the whole `root` dir into the asset).
assets:

  # ── ai-asset-management ───────────────────────────────────────────────────
  - { kind: agent,    name: skaile, root: ai-asset-management/agents/skaile }
  - { kind: bundle,   name: ai-asset-management, files: [ai-asset-management/ai-asset-management.bundle.yaml] }
